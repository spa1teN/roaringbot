services:
  postgres:
    image: postgres:16-alpine
    container_name: roaringbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-roaringbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-roaringbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-roaringbot} -d ${DB_NAME:-roaringbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - roaringbot-network

  bot:
    build: .
    container_name: roaringbot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-roaringbot}
      - DB_USER=${DB_USER:-roaringbot}
      - DB_PASSWORD=${DB_PASSWORD:?Database password required}
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - roaringbot-network

volumes:
  postgres_data:
    name: roaringbot-postgres-data

networks:
  roaringbot-network:
    name: roaringbot-network
    driver: bridge
